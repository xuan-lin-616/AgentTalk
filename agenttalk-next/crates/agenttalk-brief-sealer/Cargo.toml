[package]
name = "agenttalk-brief-sealer"
version = "0.1.0"
edition = "2021"
description = "Filesystem brief sealer and Core-owned content-addressed store for orchestration snapshots"
license = "MIT OR Apache-2.0"

[dependencies]
agenttalk-orchestration-contracts = { path = "../agenttalk-orchestration-contracts" }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }
