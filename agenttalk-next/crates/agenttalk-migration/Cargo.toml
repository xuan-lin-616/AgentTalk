[package]
name = "agenttalk-migration"
version = "0.1.0"
edition = "2021"

[dependencies]
agenttalk-domain = { path = "../agenttalk-domain" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[[bin]]
name = "agenttalk-migrate"
path = "src/main.rs"
