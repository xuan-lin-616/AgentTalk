[package]
name = "agenttalk-core"
version = "0.1.0"
edition = "2021"

[dependencies]
agenttalk-context = { path = "../../crates/agenttalk-context" }
agenttalk-domain = { path = "../../crates/agenttalk-domain" }
agenttalk-events = { path = "../../crates/agenttalk-events" }
agenttalk-ipc = { path = "../../crates/agenttalk-ipc" }
agenttalk-permissions = { path = "../../crates/agenttalk-permissions" }
agenttalk-runtime-host = { path = "../runtime_host" }
agenttalk-protocols = { path = "../../crates/agenttalk-protocols" }
agenttalk-storage = { path = "../../crates/agenttalk-storage" }
base64 = "0.22"
getrandom = "0.3"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
agenttalk-ipc = { path = "../../crates/agenttalk-ipc" }
agenttalk-protocols = { path = "../../crates/agenttalk-protocols" }
jsonschema = { version = "0.49.9", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
