[package]
name = "agenttalk-runtime-host"
version = "0.1.0"
edition = "2021"

[dependencies]
agenttalk-domain = { path = "../../crates/agenttalk-domain" }
agenttalk-events = { path = "../../crates/agenttalk-events" }
quick-xml = "0.41"
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Management_Deployment", "ApplicationModel", "Storage", "Foundation_Collections", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading"] }
